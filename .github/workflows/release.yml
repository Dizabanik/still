name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v0.1.0 or v0.1.0-rc.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag syntax
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require an existing tag on main and a matching VERSION
        id: tag
        run: |
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git merge-base --is-ancestor "$tag_commit" origin/main
          [[ "${RELEASE_TAG#v}" == "$(cat VERSION)" ]]
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Release verification
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ needs.validate.outputs.tag }}

  source:
    name: Source archive
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          submodules: recursive
          persist-credentials: false
      - name: Include the pinned timbr sources and license notices
        run: python3 scripts/package_release.py --output dist --source
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source
          retention-days: 7
          if-no-files-found: error
          path: dist/*

  publish:
    name: Publish verified release
    needs: [validate, verify, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          extra=()
          if [[ "$PRERELEASE" == true ]]; then extra+=(--prerelease); fi
          # A retry updates a draft but never silently replaces a public release.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > is-draft.txt; then
            [[ "$(cat is-draft.txt)" == true ]]
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "Kawa ${RELEASE_TAG#v}" "${extra[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${extra[@]}"
