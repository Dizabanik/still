name: Compiler or runtime bug
description: Report incorrect behavior, a diagnostic problem, or a compiler crash.
body:
  - type: textarea
    id: environment
    attributes:
      label: Toolchain and platform
      description: Include the Whisky commit/version, OS/architecture, and LLVM/Clang versions.
      placeholder: still --version; llvm-config --version; clang --version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal Whisky program and the exact commands, flags, and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include stdout, stderr, exit status, and any relevant IR or reports.
    validations:
      required: true
